name: CI Verify (Maven Package)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show Maven & JDK version
        run: |
          mvn -v
          java -version

      - name: Build jar (skip tests)
        run: mvn -B -DskipTests package

      - name: List artifacts
        run: ls -lh target/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: taos-jdbcdriver
          path: target/*.jar
          retention-days: 7
